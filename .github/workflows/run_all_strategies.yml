name: Daily Auto Run All Strategies

on:
  schedule:
    # 每天 UTC 03:00 執行 = 台灣時間 (UTC+8) 每日 11:00 AM
    - cron: '0 3 * * *'
  workflow_dispatch: # 保留手動按鈕觸發功能

jobs:
  run-strategies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas tabulate requests yfinance

      - name: Run main.py script
        run: |
          python main.py

      - name: Commit and push updated results and README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md results/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Daily update strategy scan results and README [skip ci]" && git push)
