name: Run Quant Multi-Strategies

on:
  schedule:
    - cron: '30 6 * * 1-5'

  workflow_dispatch:
    inputs:
      target_strategy:
        description: '請選擇要執行的策略'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - v3_10
          - v6_6_ETF
          - v6_0
          - v5_73_ETF
          - v5_6

      filter_mode:
        description: '訊號過濾模式 (ALL: 全部 / BUY: 僅買進 / WATCH: 僅觀察 / AVOID: 僅觀望 / SELL: 僅賣出)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - BUY
          - WATCH
          - AVOID
          - SELL

permissions:
  contents: write

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance tabulate lxml html5lib

      - name: Execute Strategy Engine
        env:
          FILTER_MODE: ${{ github.event.inputs.filter_mode || 'ALL' }}
        run: |
          python main.py ${{ github.event.inputs.target_strategy || 'ALL' }}

      - name: Commit & Push Results to GitHub
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto update quant strategy results [skip ci]"
          file_pattern: 'results/* README.md'
