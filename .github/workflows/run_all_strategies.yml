name: Daily Quant Strategy Pipeline

on:
  schedule:
    - cron: '0 3 * * *' # 每天 UTC 03:00 (台灣時間 11:00 AM) 執行
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write # 賦予 GitHub Actions 寫入倉庫的權限

jobs:
  run-strategies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests markdown tabulate

      - name: Clean old results on cloud before running
        run: |
          echo "🧹 強制清空雲端 results/ 資料夾下的所有舊 CSV..."
          rm -f results/*.csv

      - name: Run Main Quant Pipeline
        run: |
          python3 main.py

      - name: Commit and push clean results & README to GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated: Daily clean old CSVs, run strategies, and update README" && git pull --rebase origin main && git push origin main)
