name: Run Quant Multi-Strategies

on:
  workflow_dispatch:
    inputs:
      target_strategy:
        description: 'Select strategy to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - v3_10
          - v6_6_ETF
          - v6_0
          - v5_73_ETF
          - v5_6
      filter_mode:
        description: 'Filter Mode'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - SHORTLIST

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Strategy Engine
        env:
          FILTER_MODE: ${{ github.event.inputs.filter_mode }}
        run: |
          python main.py ${{ github.event.inputs.target_strategy }}

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update quant results and README [skip ci]"
          file_pattern: "results/* README.md"
